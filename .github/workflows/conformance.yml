# Plugin SDK conformance gate: every change must keep the contract green, and
# main re-runs each first-party plugin's conformance suite against the new SDK.
# Pull requests run without cross-repository credentials. Consumer fanout is a
# protected, trusted-main integration using repository-scoped GitHub App tokens.
name: conformance

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Remove checkout Git configuration
        run: rm -f .git/config
      - name: Prove pull requests have no integration credential
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          FUTURE_REPO_PAT: synthetic-parent-canary
        run: |
          set -euo pipefail
          env -i \
            PATH="$PATH" \
            HOME="$HOME" \
            TMPDIR="${TMPDIR:-/tmp}" \
            LANG="${LANG:-C.UTF-8}" \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            bash <<'PR_CREDENTIAL_PROOF'
          set -euo pipefail
          [ -z "${FUTURE_REPO_PAT:-}" ] || {
            echo "::error::parent credential reached the pull-request proof child"
            exit 1
          }
          while IFS= read -r config; do
            if grep -Eiq 'authorization:|credential\.helper|x-access-token|oauth2:|bearer ' "$config"; then
              echo "::error::credential-bearing Git config is visible at $config"
              exit 1
            fi
          done < <(find "$GITHUB_WORKSPACE" -path '*/.git/config' -type f -print)
          read_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            https://api.github.com/repos/Beamfall/plugin-adult)"
          [ "$read_status" = 404 ] || {
            echo "::error::private repository read returned HTTP $read_status, want 404"
            exit 1
          }
          dispatch_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/Beamfall/plugin-adult/actions/workflows/conformance.yml/dispatches \
            --data '{"ref":"synthetic-pr-canary-invalid-ref","inputs":{"sdk_ref":"synthetic-pr-canary"}}')"
          [ "$dispatch_status" = 404 ] || {
            echo "::error::private workflow dispatch returned HTTP $dispatch_status, want 404"
            exit 1
          }
          PR_CREDENTIAL_PROOF
      - run: script/sdk-consumer-fanout_test.sh
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: gofmt -l . | tee /dev/stderr | (! grep -q .)
      - run: go vet ./...
      - run: script/gate.sh --coverage-only
      - run: script/tool_pin_policy_test.sh
      - run: go -C tools tool govulncheck -C .. ./...
      - uses: golangci/golangci-lint-action@25e2cdc5eb1d7a04fdc45ff538f1a00e960ae128 # v8.0.0
        with:
          version: v2.12.2

  notify-consumers:
    needs: conformance
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    environment: trusted-integration
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - consumer: adult
            repository: plugin-adult
          - consumer: audiobook
            repository: plugin-audiobook
          - consumer: enrichment
            repository: plugin-enrichment
          - consumer: familyarchive
            repository: plugin-familyarchive
          - consumer: filmtv
            repository: plugin-filmtv
          - consumer: music
            repository: plugin-music
          - consumer: photos
            repository: plugin-photos
          - consumer: podcasts
            repository: plugin-podcasts
    name: Dispatch ${{ matrix.consumer }} conformance
    timeout-minutes: 65
    steps:
      - name: Checkout SDK proof runner
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Remove checkout Git configuration
        run: rm -f .git/config
      - name: Mint consumer-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CI_INTEGRATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_INTEGRATION_APP_PRIVATE_KEY }}
          owner: Beamfall
          repositories: ${{ matrix.repository }}
          permission-actions: write
          permission-contents: read
          skip-token-revoke: false
      - name: Dispatch and prove downstream conformance
        env:
          CONSUMER: ${{ matrix.consumer }}
          REPOSITORY: Beamfall/${{ matrix.repository }}
          SDK_REF: ${{ github.sha }}
          FANOUT_TIMEOUT_MINUTES: ${{ vars.SDK_FANOUT_TIMEOUT_MINUTES || '30' }}
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          SDK_FANOUT_CONSUMER="$CONSUMER" \
          SDK_FANOUT_REPOSITORY="$REPOSITORY" \
          SDK_FANOUT_SDK_SHA="$SDK_REF" \
          SDK_FANOUT_TOKEN="$TOKEN" \
          SDK_FANOUT_TIMEOUT_MINUTES="$FANOUT_TIMEOUT_MINUTES" \
          SDK_FANOUT_RECEIPT="receipts/$CONSUMER.json" \
            script/sdk-consumer-fanout_test.sh fanout | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload immutable conformance receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: downstream-conformance-${{ matrix.consumer }}-${{ github.sha }}
          path: receipts/${{ matrix.consumer }}.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false
