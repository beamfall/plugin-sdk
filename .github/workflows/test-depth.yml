name: test-depth

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  race:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Discover and run required parser fuzz targets
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            '. FuzzLocaleStringJSON'
            './catalogindex FuzzParseAndVerify'
          )
          for target in "${targets[@]}"; do
            read -r package name <<<"$target"
            timeout 30s go test "$package" -run '^$' -list "^${name}$" | grep -Fxq "$name" || {
              echo "required fuzz target $package:$name is absent" >&2
              exit 1
            }
            timeout 45s go test "$package" -run '^$' -fuzz "^${name}$" -fuzztime=30s
          done
