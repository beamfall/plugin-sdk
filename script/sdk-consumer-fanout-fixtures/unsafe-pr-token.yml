name: unsafe pull-request token access

on:
  pull_request:

jobs:
  uncapped-token:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@synthetic
        with:
          persist-credentials: false

  persisted-token:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@synthetic

  trusted-only:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@synthetic
