name: unsafe expression credential references

on:
  pull_request:

jobs:
  format-secret:
    env:
      TOKEN: "${{ format('{0}', secrets['NAME']) }}"
    steps:
      - run: make test

  json-secrets:
    env:
      SECRET_CONTEXT: ${{ toJson(secrets) }}
    steps:
      - run: make test

  json-github:
    env:
      GITHUB_CONTEXT: ${{ toJson(github) }}
    steps:
      - run: make test

  literal-secret-name:
    env:
      LABEL: "${{ format('{0}', 'secrets.NAME') }}"
    steps:
      - run: make test
